version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_ACCESS_SECRET=friendmap_jwt_production_access_key_super_secret_min_32_chars!
      - JWT_REFRESH_SECRET=friendmap_jwt_production_refresh_key_super_secret_min_32_chars!
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-data:
