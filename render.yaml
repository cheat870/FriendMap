services:
  # FriendMap Backend Web Service (API & WebSockets)
  - type: web
    name: friendmap-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: 715090036708-djgkdmqpurkmoafrkav99tom32eu5m71.apps.googleusercontent.com
